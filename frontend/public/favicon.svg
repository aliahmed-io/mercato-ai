<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="mercatoBg" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1A2E26"/>
      <stop offset="100%" stop-color="#0E1914"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Dark Ink Rounded Container with subtle border -->
  <rect width="32" height="32" rx="8" fill="url(#mercatoBg)"/>
  <rect x="0.75" y="0.75" width="30.5" height="30.5" rx="7.25" fill="none" stroke="#2A453B" stroke-width="0.75"/>

  <!-- Geometric Forecast 'M' Polyline -->
  <path 
    d="M 6.5 22.5 L 6.5 11 L 12.5 17 L 19.5 11 L 25.5 22.5" 
    stroke="#D4F83A" 
    stroke-width="2.6" 
    stroke-linecap="round" 
    stroke-linejoin="round"
  />

  <!-- High-Precision Forecast Node with Luminous Halo -->
  <circle cx="19.5" cy="11" r="4.2" fill="#D4F83A" fill-opacity="0.25"/>
  <circle cx="19.5" cy="11" r="2.2" fill="#D4F83A" filter="url(#glow)"/>
  <circle cx="19.5" cy="11" r="1" fill="#FFFFFF"/>
</svg>
